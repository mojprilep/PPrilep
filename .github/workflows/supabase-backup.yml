name: Supabase daily backup

on:
  # PAUSED 2026-09-14. The project moved to the Supabase Pro ($25) plan, which
  # provides managed daily backups, so this DIY dump is redundant — and it read
  # the whole DB every morning, adding egress we no longer want to spend. Kept
  # (not deleted) so it can be re-enabled if we ever leave Pro: uncomment the
  # schedule below. Manual runs still work via workflow_dispatch.
  # schedule:
  #   # 05:30 UTC ≈ 07:30 Europe/Skopje (UTC+2 in summer / DST, UTC+1 in winter).
  #   # Cron has no timezone support, so this drifts to ~06:30 local in winter.
  #   - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PPrilep (for scripts/backup.mjs)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Checkout backups repo
        uses: actions/checkout@v5
        with:
          repository: mojprilep/pprilep-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: pprilep-backups

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install deps (supabase-js only)
        run: npm install @supabase/supabase-js

      - name: Run backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs "$GITHUB_WORKSPACE/pprilep-backups"

      - name: Commit and push backup
        working-directory: pprilep-backups
        run: |
          git config user.name "supabase-backup-bot"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Backup $(date -u +%Y-%m-%dT%H-%M-%S)Z"
          git push
